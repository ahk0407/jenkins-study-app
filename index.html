<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO CI/CD 웹 앱</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f7f9fa;
    }
    h1 { color: #333; text-align: center; }
    .input-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #0052a3; }
    ul { list-style: none; padding: 0; }
    li {
      background: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 4px;
      border: 1px solid #e1e4e8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .date { font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>📋 TODO 관리 앱</h1>

  <div class="input-box">
    <input type="text" id="todoInput" placeholder="새로운 할 일을 입력하세요...">
    <button onclick="addTodo()">추가</button>
  </div>

  <ul id="todoList"></ul>

  <script>
    const API_URL = '/api/todos';

    // 목록 불러오기 (GET)
    async function loadTodos() {
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        const listEl = document.getElementById('todoList');
        listEl.innerHTML = '';

        result.data.forEach(todo => {
          const li = document.createElement('li');
          const date = new Date(todo.created_at).toLocaleTimeString();
          li.innerHTML = `
            <span>${todo.title}</span>
            <span class="date">${date}</span>
          `;
          listEl.appendChild(li);
        });
      } catch (err) {
        console.error('목록 조회 실패:', err);
      }
    }

    // 할 일 추가 (POST)
    async function addTodo() {
      const input = document.getElementById('todoInput');
      const title = input.value.trim();
      if (!title) return alert('할 일을 입력하세요');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });

        if (res.ok) {
          input.value = '';
          loadTodos();
        }
      } catch (err) {
        console.error('등록 실패:', err);
      }
    }

    // 초기 로딩
    loadTodos();
  </script>
</body>
</html>
